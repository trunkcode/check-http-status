name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The command or code you ran, and a public URL that shows the problem if you can share one.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: check-http-status version
      placeholder: "2.2.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: "Node 22, macOS 15"
